
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a2650">
<title>لوحة الطلبات | أناقة الحجاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
try {
 const saved = localStorage.getItem('theme');
 document.documentElement.dataset.theme =
 saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
} catch(e) {
 document.documentElement.dataset.theme = 'light';
}
</script>

<style>
:root {
 --bg:#f7f3f6;
 --surface:#fff;
 --surface2:#fbf8fa;
 --ink:#2d1a31;
 --muted:#806d82;
 --brand:#542d5b;
 --accent:#bd8295;
 --line:#eadfe9;
 --success:#287a55;
 --danger:#b53b45;
 --warning:#a96e16;
 --shadow:0 12px 32px rgba(57,29,62,.07);
 --radius:20px;
}

:root[data-theme="dark"] {
 color-scheme:dark;
 --bg:#151019;
 --surface:#211a27;
 --surface2:#2a2130;
 --ink:#f4edf5;
 --muted:#b9a9bd;
 --brand:#d2a2d7;
 --accent:#d99bad;
 --line:#3c3042;
 --success:#78c69d;
 --danger:#f08b91;
 --warning:#e7bd70;
 --shadow:0 12px 32px rgba(0,0,0,.22);
}

* {
 box-sizing:border-box;
 margin:0;
}

body {
 font-family:"Tajawal",sans-serif;
 background:var(--bg);
 color:var(--ink);
 line-height:1.65;
 min-height:100vh;
 transition:background .2s,color .2s;
}

button,input {font:inherit}
button {cursor:pointer}
a {color:inherit}

:focus-visible {
 outline:3px solid var(--accent);
 outline-offset:3px;
}

.shell {
 max-width:1240px;
 margin:auto;
 padding:0 22px;
}

/* Header */

.topbar {
 background:var(--surface);
 border-bottom:1px solid var(--line);
 position:sticky;
 top:0;
 z-index:10;
 backdrop-filter:blur(14px);
}

.topbar-inner {
 height:76px;
 display:flex;
 align-items:center;
 gap:16px;
}

.brand {
 display:flex;
 align-items:center;
 gap:12px;
 margin-inline-end:auto;
}

.brand-mark {
 width:44px;
 height:44px;
 border-radius:15px;
 background:linear-gradient(145deg,var(--brand),var(--accent));
 color:white;
 display:grid;
 place-items:center;
 font-size:1.35rem;
}

.brand h1 {font-size:1.15rem}
.brand p {font-size:.82rem;color:var(--muted)}

.top-actions {
 display:flex;
 gap:9px;
 align-items:center;
}

.icon-btn {
 width:42px;
 height:42px;
 border:1px solid var(--line);
 border-radius:14px;
 background:var(--surface2);
 color:var(--ink);
 display:grid;
 place-items:center;
 font-size:1.1rem;
}

.refresh-btn {
 border:0;
 border-radius:13px;
 background:var(--brand);
 color:white;
 padding:10px 17px;
 font-weight:700;
}

/* Main */

main {padding:30px 0 60px}

.welcome {
 display:flex;
 align-items:end;
 justify-content:space-between;
 gap:15px;
 margin-bottom:22px;
}

.welcome h2 {
 font-size:clamp(1.55rem,3vw,2rem);
}

.welcome p {
 color:var(--muted);
 margin-top:4px;
}

.live {
 display:inline-flex;
 align-items:center;
 gap:7px;
 color:var(--success);
 font-size:.9rem;
 font-weight:700;
}

.live:before {
 content:"";
 width:8px;
 height:8px;
 border-radius:50%;
 background:var(--success);
}

/* Statistics */

.stats {
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:14px;
 margin-bottom:24px;
}

.stat {
 position:relative;
 overflow:hidden;
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:18px;
 box-shadow:var(--shadow);
 min-height:125px;
}

.stat-top {
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 color:var(--muted);
 font-weight:600;
 font-size:.9rem;
}

.stat-icon {
 width:36px;
 height:36px;
 border-radius:12px;
 display:grid;
 place-items:center;
 background:var(--tint);
 color:var(--tone);
}

.stat strong {
 display:block;
 font-size:1.8rem;
 margin-top:12px;
 color:var(--tone);
}

.stat.total {
 --tone:var(--brand);
 --tint:#542d5b18;
}

.stat.pending {
 --tone:var(--warning);
 --tint:#a96e1618;
}

.stat.confirmed {
 --tone:var(--success);
 --tint:#287a5518;
}

.stat.cancelled {
 --tone:var(--danger);
 --tint:#b53b4518;
}

.stat.revenue {
 --tone:var(--accent);
 --tint:#bd829518;
}

.stat small {
 color:var(--muted);
 font-size:.78rem;
}

/* Orders panel */

.panel {
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 overflow:hidden;
}

.panel-head {
 padding:18px 20px;
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:14px;
 flex-wrap:wrap;
}

.panel-title h3 {font-size:1.2rem}
.panel-title p {font-size:.86rem;color:var(--muted)}

.tools {
 display:flex;
 align-items:center;
 gap:9px;
 flex-wrap:wrap;
}

.search {
 position:relative;
 min-width:min(280px,100%);
}

.search input {
 width:100%;
 height:42px;
 padding:8px 40px 8px 13px;
 border:1px solid var(--line);
 border-radius:12px;
 background:var(--surface2);
 color:var(--ink);
}

.search:before {
 content:"⌕";
 position:absolute;
 right:14px;
 top:4px;
 font-size:1.5rem;
 color:var(--muted);
}

.clear-btn {
 height:42px;
 padding:0 14px;
 border:1px solid var(--line);
 border-radius:12px;
 background:var(--surface2);
 color:var(--ink);
}

/* Filters */

.tabs {
 display:flex;
 gap:8px;
 padding:14px 20px 0;
 overflow:auto;
}

.tab {
 white-space:nowrap;
 border:1px solid var(--line);
 background:var(--surface2);
 color:var(--muted);
 padding:8px 16px;
 border-radius:30px;
 font-weight:700;
}

.tab.active {
 background:var(--brand);
 border-color:var(--brand);
 color:white;
}

.tab .count {
 margin-inline-start:5px;
 opacity:.75;
 font-size:.8rem;
}

/* Order cards */

.orders {
 padding:16px 20px 20px;
 display:grid;
 gap:13px;
}

.order {
 border:1px solid var(--line);
 border-inline-start:5px solid var(--warning);
 border-radius:16px;
 padding:17px;
 background:var(--surface2);
 display:grid;
 grid-template-columns:minmax(0,1fr) auto;
 gap:16px;
 transition:.2s;
}

.order:hover {
 box-shadow:0 16px 36px rgba(57,29,62,.13);
 transform:translateY(-2px);
}

.order.confirmed {
 border-inline-start-color:var(--success);
}

.order.cancelled {
 border-inline-start-color:var(--danger);
 opacity:.83;
}

.order-title {
 display:flex;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
}

.order-title h4 {font-size:1.08rem}

.order-id {
 font-size:.78rem;
 color:var(--muted);
 direction:ltr;
}

.status {
 font-size:.78rem;
 padding:4px 11px;
 border-radius:30px;
 font-weight:700;
 background:#a96e1618;
 color:var(--warning);
}

.confirmed .status {
 background:#287a5518;
 color:var(--success);
}

.cancelled .status {
 background:#b53b4518;
 color:var(--danger);
}

/* Order details */

.meta {
 display:grid;
 grid-template-columns:repeat(3,minmax(150px,1fr));
 gap:10px 18px;
 margin-top:14px;
}

.meta-item {min-width:0}

.meta-label {
 display:block;
 color:var(--muted);
 font-size:.8rem;
}

.meta-value {
 font-weight:600;
 overflow-wrap:anywhere;
}

.meta-value a {text-decoration:none}

.color-dot {
 display:inline-block;
 width:13px;
 height:13px;
 border-radius:50%;
 vertical-align:-2px;
 border:1px solid #8886;
 margin-inline-end:4px;
}

/* Actions */

.order-actions {
 display:flex;
 flex-direction:column;
 justify-content:center;
 gap:8px;
 min-width:145px;
}

.action {
 border:0;
 border-radius:11px;
 padding:10px 13px;
 color:white;
 font-weight:700;
 transition:.2s;
}

.action:hover {
 filter:brightness(1.08);
 transform:translateY(-1px);
}

.action.confirm {background:var(--success)}
.action.cancel {background:var(--danger)}
.action.restore {background:#79677e}

/* Empty */

.empty {
 padding:58px 15px;
 text-align:center;
 color:var(--muted);
}

.empty-icon {
 width:62px;
 height:62px;
 border-radius:20px;
 background:var(--surface2);
 display:grid;
 place-items:center;
 font-size:1.7rem;
 margin:0 auto 12px;
}

.empty h4 {
 font-size:1.1rem;
 color:var(--ink);
 margin-bottom:3px;
}

.footer-note {
 text-align:center;
 color:var(--muted);
 font-size:.82rem;
 padding:18px;
}

/* Responsive */

@media(max-width:1000px) {
 .stats {grid-template-columns:repeat(3,1fr)}
 .meta {grid-template-columns:repeat(2,minmax(140px,1fr))}
}

@media(max-width:650px) {
 .shell {padding:0 13px}
 .topbar-inner {height:66px}
 .brand-mark {width:39px;height:39px}
 .brand h1 {font-size:1rem}
 .brand p {font-size:.75rem}
 .refresh-btn {padding:9px 11px;font-size:.88rem}
 .welcome {align-items:start;flex-direction:column}
 .stats {grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .stat {padding:13px;min-height:110px}
 .stat strong {font-size:1.5rem}
 .panel-head {padding:15px}
 .tools {width:100%}
 .search {flex:1;min-width:0}
 .tabs {padding-inline:14px}
 .orders {padding:12px}
 .order {grid-template-columns:1fr;padding:14px}
 .meta {grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
 .order-actions {min-width:0;flex-direction:row}
 .action {flex:1;padding:9px 7px;font-size:.86rem}
}
</style>
</head>

<body>

<header class="topbar">
 <div class="shell topbar-inner">

  <div class="brand">
   <div class="brand-mark">✿</div>
   <div>
    <h1>أناقة الحجاب</h1>
    <p>لوحة إدارة الطلبات</p>
   </div>
  </div>

  <div class="top-actions">
   <button class="icon-btn" id="themeBtn" type="button">🌙</button>
   <button class="refresh-btn" id="refreshBtn" type="button">↻ تحديث</button>
  </div>

 </div>
</header>

<main class="shell">

 <div class="welcome">
  <div>
   <h2>مرحباً بك في لوحة التحكم</h2>
   <p>تابع طلبات متجرك وأدر حالتها من مكان واحد.</p>
  </div>
  <span class="live">بيانات المتصفح</span>
 </div>

 <div class="stats" id="stats"></div>

 <section class="panel">

  <div class="panel-head">

   <div class="panel-title">
    <h3>الطلبات الواردة</h3>
    <p>ابحث عن طلب أو صفِّ القائمة حسب حالته.</p>
   </div>

   <div class="tools">
    <div class="search">
     <input id="searchInput" type="search"
      placeholder="ابحث بالاسم أو الهاتف أو المنتج...">
    </div>
    <button class="clear-btn" id="clearSearch">مسح البحث</button>
   </div>

  </div>

  <div class="tabs" id="tabs"></div>
  <div class="orders" id="orders"></div>

 </section>

 <p class="footer-note">أناقة الحجاب · لوحة إدارة الطلبات</p>

</main>

<script>
const STORE_KEY = 'hijab_orders';

const STATUS = {
 pending: {label:'قيد الانتظار',icon:'◷'},
 confirmed: {label:'تم التأكيد',icon:'✓'},
 cancelled: {label:'ملغى',icon:'×'}
};

let filter = 'all';
let searchTerm = '';

const $ = selector => document.querySelector(selector);

function escapeHTML(value) {
 return String(value ?? '').replace(/[&<>"']/g, char => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 })[char]);
}

function loadOrders() {
 try {
  const data = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  return Array.isArray(data) ? data : [];
 } catch(e) {
  return [];
 }
}

function saveOrders(orders) {
 localStorage.setItem(STORE_KEY, JSON.stringify(orders));
}

function money(value) {
 return (Number(value) || 0).toLocaleString('ar-DZ') + ' دج';
}

function safeColor(value) {
 return /^#[0-9a-f]{3,8}$/i.test(String(value || ''))
  ? value : '#b4707c';
}

function dateText(value) {
 const date = new Date(value);

 return Number.isNaN(date.getTime())
  ? '—'
  : date.toLocaleString('ar-DZ',{
     dateStyle:'medium',
     timeStyle:'short'
    });
}

/* Statistics */

function getStats(orders) {

 const count = status =>
  orders.filter(order => order.status === status).length;

 const revenue = orders
  .filter(order => order.status === 'confirmed')
  .reduce((sum, order) =>
   sum + (Number(order.total) || 0), 0);

 return [
  {
   label:'كل الطلبات',
   value:orders.length,
   icon:'▤',
   className:'total'
  },
  {
   label:'قيد الانتظار',
   value:count('pending'),
   icon:'◷',
   className:'pending'
  },
  {
   label:'تم التأكيد',
   value:count('confirmed'),
   icon:'✓',
   className:'confirmed'
  },
  {
   label:'الطلبات الملغاة',
   value:count('cancelled'),
   icon:'×',
   className:'cancelled'
  },
  {
   label:'المبيعات المؤكدة',
   value:money(revenue),
   icon:'دج',
   className:'revenue'
  }
 ];
}

function renderStats(orders) {

 $('#stats').innerHTML = getStats(orders).map(stat => `
  <article class="stat ${stat.className}">
   <div class="stat-top">
    <span>${stat.label}</span>
    <span class="stat-icon">${stat.icon}</span>
   </div>
   <strong>${stat.value}</strong>
   <small>${stat.className === 'revenue'
    ? 'من الطلبات المؤكدة فقط'
    : 'طلب'}</small>
  </article>
 `).join('');
}

/* Filters */

function renderTabs(orders) {

 const definitions = [
  ['all','الكل',orders.length],
  ['pending','قيد الانتظار',
   orders.filter(o => o.status === 'pending').length],
  ['confirmed','تم التأكيد',
   orders.filter(o => o.status === 'confirmed').length],
  ['cancelled','ملغى',
   orders.filter(o => o.status === 'cancelled').length]
 ];

 $('#tabs').innerHTML = definitions.map(([key,label,count]) => `
  <button class="tab ${filter === key ? 'active' : ''}"
   data-filter="${key}" type="button">
   ${label}<span class="count">${count}</span>
  </button>
 `).join('');

 document.querySelectorAll('[data-filter]').forEach(button => {
  button.addEventListener('click', () => {
   filter = button.dataset.filter;
   render();
  });
 });
}

/* Order card */

function orderCard(order) {

 const status = STATUS[order.status] || STATUS.pending;

 const orderId = escapeHTML(order.id || '—');
 const color = safeColor(order.colorHex);

 const phone = String(order.phone || '');
 const safePhone = phone.replace(/[^\d+]/g,'');

 let actions = '';

 if(order.status === 'pending') {

  actions = `
   <button class="action confirm"
    data-id="${orderId}"
    data-status="confirmed">
    تأكيد الطلب ✓
   </button>

   <button class="action cancel"
    data-id="${orderId}"
    data-status="cancelled">
    إلغاء الطلب ×
   </button>
  `;

 } else {

  actions = `
   <button class="action restore"
    data-id="${orderId}"
    data-status="pending">
    إعادة للانتظار ↶
   </button>
  `;
 }

 return `
  <article class="order ${escapeHTML(order.status || 'pending')}">

   <div>

    <div class="order-title">
     <h4>${escapeHTML(order.name)} ${escapeHTML(order.surname)}</h4>
     <span class="status">${status.icon} ${status.label}</span>
     <span class="order-id">#${orderId}</span>
    </div>

    <div class="meta">

     <div class="meta-item">
      <span class="meta-label">رقم الهاتف</span>
      <div class="meta-value">
       <a href="tel:${escapeHTML(safePhone)}" dir="ltr">
        ${escapeHTML(phone || '—')}
       </a>
      </div>
     </div>

     <div class="meta-item">
      <span class="meta-label">الولاية</span>
      <div class="meta-value">
       ${escapeHTML(order.wilayaCode)} -
       ${escapeHTML(order.wilayaAr)}
      </div>
     </div>

     <div class="meta-item">
      <span class="meta-label">البلدية</span>
      <div class="meta-value">${escapeHTML(order.commune)}</div>
     </div>

     <div class="meta-item">
      <span class="meta-label">المنتج</span>
      <div class="meta-value">${escapeHTML(order.productAr)}</div>
     </div>

     <div class="meta-item">
      <span class="meta-label">القياس</span>
      <div class="meta-value">${escapeHTML(order.size || '—')}</div>
     </div>

     <div class="meta-item">
      <span class="meta-label">اللون</span>
      <div class="meta-value">
       <i class="color-dot" style="background:${color}"></i>
       ${escapeHTML(order.colorAr || '—')}
      </div>
     </div>

     <div class="meta-item">
      <span class="meta-label">الكمية</span>
      <div class="meta-value">${Number(order.qty) || 0}</div>
     </div>

     <div class="meta-item">
      <span class="meta-label">المجموع</span>
      <div class="meta-value">${money(order.total)}</div>
     </div>

     <div class="meta-item">
      <span class="meta-label">تاريخ الطلب</span>
      <div class="meta-value">${dateText(order.date)}</div>
     </div>

    </div>
   </div>

   <div class="order-actions">${actions}</div>

  </article>
 `;
}

/* Search */

function matchesSearch(order) {

 const fields = [
  order.name,
  order.surname,
  order.phone,
  order.productAr,
  order.wilayaAr,
  order.commune,
  order.id
 ];

 const searchable = fields.join(' ').toLocaleLowerCase('ar');

 return searchable.includes(
  searchTerm.toLocaleLowerCase('ar')
 );
}

/* Render orders */

function renderOrders(orders) {

 const filtered = orders.filter(order =>
  (filter === 'all' || order.status === filter) &&
  matchesSearch(order)
 );

 if(!filtered.length) {

  $('#orders').innerHTML = `
   <div class="empty">
    <div class="empty-icon">⌕</div>
    <h4>${orders.length
     ? 'لا توجد نتائج مطابقة'
     : 'لا توجد طلبات بعد'}</h4>
    <p>${orders.length
     ? 'جرّب تغيير كلمات البحث أو حالة الطلب.'
     : 'ستظهر الطلبات هنا عندما يرسل العملاء طلباتهم.'}</p>
   </div>
  `;

  return;
 }

 $('#orders').innerHTML = filtered.map(orderCard).join('');

 document.querySelectorAll('[data-status][data-id]')
  .forEach(button => {

   button.addEventListener('click', () => {
    updateStatus(
     button.dataset.id,
     button.dataset.status
    );
   });

  });
}

/* Main render */

function render() {

 const orders = loadOrders();

 renderStats(orders);
 renderTabs(orders);
 renderOrders(orders);

 $('#themeBtn').textContent =
  document.documentElement.dataset.theme === 'dark'
   ? '☀️' : '🌙';
}

/* Change order status */

function updateStatus(id,status) {

 const orders = loadOrders();

 const order = orders.find(
  item => String(item.id) === String(id)
 );

 if(!order || !STATUS[status]) return;

 order.status = status;

 saveOrders(orders);
 render();
}

/* Theme */

function setTheme(theme) {

 document.documentElement.dataset.theme = theme;

 localStorage.setItem('theme',theme);

 $('#themeBtn').textContent =
  theme === 'dark' ? '☀️' : '🌙';

 $('#themeBtn').title =
  theme === 'dark'
   ? 'تفعيل الوضع النهاري'
   : 'تفعيل الوضع الليلي';
}

$('#themeBtn').addEventListener('click',() => {

 const next =
  document.documentElement.dataset.theme === 'dark'
   ? 'light'
   : 'dark';

 setTheme(next);
});

/* Refresh */

$('#refreshBtn').addEventListener('click',render);

/* Search input */

$('#searchInput').addEventListener('input',event => {

 searchTerm = event.target.value.trim();

 renderOrders(loadOrders());
});

/* Clear search */

$('#clearSearch').addEventListener('click',() => {

 $('#searchInput').value = '';
 searchTerm = '';

 renderOrders(loadOrders());
});

/* Sync between tabs in same browser */

window.addEventListener('storage',event => {

 if(event.key === STORE_KEY) {
  render();
 }

});

/* Start */

setTheme(
 document.documentElement.dataset.theme || 'light'
);

render();

</script>
</body>
</html>
