<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Moni Cook – حلويات فاخرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Tajawal:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* -----------------------------------------------------------
   الأنماط الخاصة بك (تم إكمال السطر الأخير المقطوع)
----------------------------------------------------------- */
:root {
  --gold: #C4965A;
  --gold-light: #E8C97A;
  --gold-dark: #8B6914;
  --rose: #C97B6B;
  --blush: #E8C4AA;
  --trans-time: 0.6s;
}
[data-theme="dark"] {
  --bg-primary:#0A0806;--bg-secondary:#120E0A;--bg-card:#1C1612;--bg-panel:#261F18;
  --text-primary:#FAF6F0;--text-muted:rgba(250,246,240,0.55);--text-faint:rgba(250,246,240,0.3);
  --border-gold:rgba(196,150,90,0.2);--border-gold2:rgba(196,150,90,0.4);
  --hero-overlay1:rgba(10,8,6,0.25);--hero-overlay2:rgba(10,8,6,0.1);--hero-overlay3:rgba(10,8,6,0.5);--hero-overlay4:rgba(10,8,6,0.98);
  --nav-bg:rgba(10,8,6,0.95);--marquee-bg:#C4965A;--marquee-text:#0A0806;
  --menu-bg:rgba(10,8,6,0.85);--menu-panel:#261F18;--stat-label:rgba(250,246,240,0.4);
  --about-ghost:rgba(196,150,90,0.04);--spec-glow:rgba(196,150,90,0.06);
  --order-bg:#120E0A;--contact-bg:#1C1612;--footer-bg:#0A0806;
  --card-overlay1:rgba(10,8,6,0.95);--card-overlay2:rgba(10,8,6,0.1);
  --img-filter:brightness(0.75) saturate(0.85);--img-hover:brightness(0.65) saturate(1);--grain-opacity:0.6;
  --configurator-bg:#0E0B08;--step-inactive:rgba(196,150,90,0.15);
  --option-bg:#1C1612;--option-hover:#261F18;--option-selected-bg:rgba(196,150,90,0.12);--summary-bg:#120E0A;
}
[data-theme="light"] {
  --bg-primary:#FAF6F0;--bg-secondary:#FFFDF9;--bg-card:#F5EDE3;--bg-panel:#EDE0D0;
  --text-primary:#2A1A0E;--text-muted:rgba(42,26,14,0.6);--text-faint:rgba(42,26,14,0.35);
  --border-gold:rgba(139,105,20,0.2);--border-gold2:rgba(139,105,20,0.45);
  --hero-overlay1:rgba(250,246,240,0.1);--hero-overlay2:rgba(250,246,240,0.04);--hero-overlay3:rgba(42,26,14,0.35);--hero-overlay4:rgba(42,26,14,0.88);
  --nav-bg:rgba(250,246,240,0.96);--marquee-bg:#2A1A0E;--marquee-text:#FAF6F0;
  --menu-bg:rgba(250,246,240,0.9);--menu-panel:#FAF6F0;--stat-label:rgba(42,26,14,0.45);
  --about-ghost:rgba(139,105,20,0.06);--spec-glow:rgba(196,150,90,0.1);
  --order-bg:#F5EDE3;--contact-bg:#EDE0D0;--footer-bg:#2A1A0E;
  --card-overlay1:rgba(42,26,14,0.88);--card-overlay2:rgba(42,26,14,0.05);
  --img-filter:brightness(0.85) saturate(0.9);--img-hover:brightness(0.75) saturate(1.05);--grain-opacity:0.3;
  --configurator-bg:#F0E8DC;--step-inactive:rgba(139,105,20,0.15);
  --option-bg:#FAF6F0;--option-hover:#EDE0D0;--option-selected-bg:rgba(196,150,90,0.15);--summary-bg:#F5EDE3;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Tajawal',sans-serif;background:var(--bg-primary);color:var(--text-primary);max-width:430px;margin:0 auto;overflow-x:hidden;transition:background var(--trans-time) ease,color var(--trans-time) ease;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");pointer-events:none;z-index:1000;opacity:var(--grain-opacity);transition:opacity var(--trans-time) ease;}

.configurator-section{background:var(--configurator-bg);padding:80px 0 0;position:relative;overflow:hidden;transition:background var(--trans-time) ease;}
.configurator-section::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to left,transparent,var(--gold),transparent);}
.config-header{padding:0 28px;margin-bottom:48px;}
.config-steps{display:flex;align-items:center;padding:0 28px;margin-bottom:44px;gap:0;}
.config-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;cursor:pointer;transition:all 0.3s ease;}
.step-circle{width:36px;height:36px;border:0.5px solid var(--step-inactive);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--text-faint);transition:all 0.4s ease;position:relative;}
.step-circle.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(196,150,90,0.1);}
.step-circle.done{background:var(--gold);border-color:var(--gold);color:#0A0806;font-size:13px;}
.step-label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);transition:color 0.3s ease;text-align:center;white-space:nowrap;}
.config-step.active-step .step-label{color:var(--gold);}
.step-connector{flex:1;height:0.5px;background:var(--step-inactive);margin:0;position:relative;top:-12px;transition:background 0.5s ease;}
.step-connector.done{background:var(--gold);}
.config-panels{padding:0 28px 48px;}
.config-panel{display:none;animation:panelFadeIn 0.5s ease;}
.config-panel.active{display:block;}
@keyframes panelFadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.panel-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--text-primary);margin-bottom:6px;transition:color var(--trans-time) ease;}
.panel-subtitle{font-size:11px;color:var(--text-faint);letter-spacing:1.5px;margin-bottom:28px;transition:color var(--trans-time) ease;}

.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.option-card{border:0.5px solid var(--border-gold);border-radius:4px;padding:16px 14px;cursor:pointer;transition:all 0.35s cubic-bezier(0.4,0,0.2,1);background:var(--option-bg);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;}
.option-card:hover{border-color:var(--border-gold2);background:var(--option-hover);}
.option-card.selected{border-color:var(--gold);background:var(--option-selected-bg);box-shadow:inset 0 0 0 0.5px var(--gold),0 4px 20px rgba(196,150,90,0.15);}
.option-card.selected::after{content:'✓';position:absolute;top:8px;left:10px;font-size:10px;color:var(--gold);}
.option-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:var(--text-primary);margin-bottom:4px;}

.filling-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.filling-chip{border:0.5px solid var(--border-gold);border-radius:100px;padding:8px 16px;cursor:pointer;font-size:12px;color:var(--text-muted);font-family:'Tajawal',sans-serif;transition:all 0.3s ease;background:var(--option-bg);display:flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;}
.filling-chip:hover{border-color:var(--border-gold2);color:var(--text-primary);}
.filling-chip.selected{border-color:var(--gold);background:var(--option-selected-bg);color:var(--gold-light);box-shadow:0 2px 12px rgba(196,150,90,0.15);}

.config-nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;}
.btn-config-next{background:var(--gold);color:#0A0806;padding:13px 28px;border-radius:2px;border:none;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.35s ease;}
.btn-config-next:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(196,150,90,0.35);}
.btn-config-next:disabled{opacity:0.35;cursor:not-allowed;}
.btn-config-prev{background:none;color:var(--text-muted);padding:13px 20px;border-radius:2px;border:0.5px solid var(--border-gold);font-family:'Tajawal',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.3s ease;}

.order-summary{background:var(--summary-bg);border:0.5px solid var(--border-gold);border-radius:6px;padding:24px;margin-bottom:24px;transition:all var(--trans-time) ease;}
.summary-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--gold-light);margin-bottom:20px;}
.summary-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--border-gold);gap:16px;}
.summary-row:last-child{border-bottom:none;}
.summary-key{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--text-faint);min-width:60px;}
.summary-val{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;color:var(--text-primary);text-align:left;flex:1;}

.btn-whatsapp{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#25D366;color:#fff;padding:16px;border-radius:2px;border:none;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.35s ease;text-decoration:none;margin-bottom:10px;}
.btn-whatsapp:hover{background:#1ebe57;transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,211,102,0.3);}
.btn-insta-order{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:transparent;border:0.5px solid var(--border-gold2);color:var(--gold);padding:14px;border-radius:2px;font-family:'Tajawal',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.35s ease;text-decoration:none;position:relative;overflow:hidden;margin-bottom:10px;}
.btn-insta-order:hover{color:#0A0806;background:var(--gold);}

footer{background:var(--footer-bg);padding:60px 28px 100px;border-top:0.5px solid var(--border-gold);transition:background var(--trans-time) ease, border-color var(--trans-time) ease;}
.footer-text {text-align: center; color: var(--gold); font-size: 14px;}
</style>
</head>
<body>

<section class="configurator-section" id="order">
  <div class="config-header">
    <h2 class="panel-title">صمم طلبك</h2>
  </div>

  <div class="config-steps">
    <div class="config-step active-step" data-step="1">
      <div class="step-circle active">1</div>
      <span class="step-label">النوع</span>
    </div>
    <div class="step-connector"></div>
    <div class="config-step" data-step="2">
      <div class="step-circle">2</div>
      <span class="step-label">الحشوات</span>
    </div>
    <div class="step-connector"></div>
    <div class="config-step" data-step="3">
      <div class="step-circle">3</div>
      <span class="step-label">الطلب</span>
    </div>
  </div>

  <div class="config-panels">
    <!-- Panel 1: Type -->
    <div class="config-panel active" id="panel-1">
      <h3 class="panel-title">اختر النوع</h3>
      <div class="options-grid">
        <div class="option-card" data-type="كعكة زفاف">
          <span class="option-name">كعكة زفاف</span>
        </div>
        <div class="option-card" data-type="كعكة ميلاد">
          <span class="option-name">كعكة ميلاد</span>
        </div>
      </div>
      <div class="config-nav">
        <div></div>
        <button class="btn-config-next" disabled>التالي</button>
      </div>
    </div>

    <!-- Panel 2: Multiple Fillings -->
    <div class="config-panel" id="panel-2">
      <h3 class="panel-title">اختر الحشوات (يمكنك اختيار أكثر من واحدة)</h3>
      <div class="filling-grid">
        <div class="filling-chip" data-fill="شوكولاتة بلجيكية">شوكولاتة بلجيكية</div>
        <div class="filling-chip" data-fill="كراميل مملح">كراميل مملح</div>
        <div class="filling-chip" data-fill="فواكه غابية">فواكه غابية</div>
        <div class="filling-chip" data-fill="كريمة فستق">كريمة فستق</div>
        <div class="filling-chip" data-fill="قهوة وبندق">قهوة وبندق</div>
      </div>
      <div class="config-nav">
        <button class="btn-config-prev">السابق</button>
        <button class="btn-config-next" disabled>التالي</button>
      </div>
    </div>

    <!-- Panel 3: Order Summary -->
    <div class="config-panel" id="panel-3">
      <div class="order-summary">
        <div class="summary-title">ملخص الطلب</div>
        <div class="summary-row">
          <span class="summary-key">النوع</span>
          <span class="summary-val" id="summary-type">-</span>
        </div>
        <div class="summary-row">
          <span class="summary-key">الحشوات</span>
          <span class="summary-val" id="summary-fillings">-</span>
        </div>
      </div>

      <!-- أزرار التواصل (تم إضافة الروابط المطلوبة) -->
      <a href="https://wa.me/qr/FMOJITEW2ZM7O1" target="_blank" class="btn-whatsapp">
        تأكيد عبر واتساب
      </a>
      <a href="https://www.instagram.com/_moni_cook_03/" target="_blank" class="btn-insta-order">
        تواصل عبر إنستغرام
      </a>
      
      <div class="config-nav">
        <button class="btn-config-prev">السابق</button>
      </div>
    </div>
  </div>
</section>

<footer>
   <div class="footer-text">Moni Cook © 2026</div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  let currentStep = 1;
  let orderData = {
    type: "",
    fillings: [] // تحويل الحشوات إلى مصفوفة (Array) للسماح بالتحديد المتعدد
  };

  const panels = document.querySelectorAll('.config-panel');
  const steps = document.querySelectorAll('.config-step');
  const nextBtns = document.querySelectorAll('.btn-config-next');
  const prevBtns = document.querySelectorAll('.btn-config-prev');

  // معالجة اختيار النوع (Single Select)
  const typeCards = document.querySelectorAll('.option-card');
  typeCards.forEach(card => {
    card.addEventListener('click', () => {
      typeCards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      orderData.type = card.getAttribute('data-type');
      checkStepValidity();
    });
  });

  // معالجة اختيار الحشوات (Multi-Select - تحديد متعدد)
  const fillingChips = document.querySelectorAll('.filling-chip');
  fillingChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const fillValue = chip.getAttribute('data-fill');
      
      // إذا كانت الحشوة موجودة مسبقاً، قم بإزالتها، وإلا قم بإضافتها
      if (orderData.fillings.includes(fillValue)) {
        orderData.fillings = orderData.fillings.filter(f => f !== fillValue);
        chip.classList.remove('selected');
      } else {
        orderData.fillings.push(fillValue);
        chip.classList.add('selected');
      }
      checkStepValidity();
    });
  });

  // التحقق من صحة الخطوة لتفعيل زر "التالي"
  function checkStepValidity() {
    const activePanel = document.querySelector('.config-panel.active');
    const nextBtn = activePanel.querySelector('.btn-config-next');
    if (!nextBtn) return;

    if (currentStep === 1) {
      nextBtn.disabled = !orderData.type;
    } else if (currentStep === 2) {
      // السماح بالمرور فقط إذا تم اختيار حشوة واحدة على الأقل
      nextBtn.disabled = orderData.fillings.length === 0;
    }
  }

  // تحديث واجهة الخطوات (الدوائر العلوية)
  function updateStepsUI() {
    panels.forEach((p, idx) => {
      p.classList.toggle('active', idx + 1 === currentStep);
    });

    steps.forEach((s, idx) => {
      const stepNum = idx + 1;
      const circle = s.querySelector('.step-circle');
      
      if (stepNum === currentStep) {
        circle.className = 'step-circle active';
        s.classList.add('active-step');
      } else if (stepNum < currentStep) {
        circle.className = 'step-circle done';
        circle.innerHTML = '✓';
        s.classList.remove('active-step');
      } else {
        circle.className = 'step-circle';
        circle.innerHTML = stepNum;
        s.classList.remove('active-step');
      }
    });

    const connectors = document.querySelectorAll('.step-connector');
    connectors.forEach((conn, idx) => {
      if (idx + 1 < currentStep) {
        conn.classList.add('done');
      } else {
        conn.classList.remove('done');
      }
    });

    // تحديث الملخص في الخطوة الأخيرة
    if (currentStep === 3) {
      document.getElementById('summary-type').textContent = orderData.type;
      // دمج جميع الحشوات المختارة وعرضها
      document.getElementById('summary-fillings').textContent = orderData.fillings.join('، ');
    }
  }

  // أزرار التنقل
  nextBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (currentStep < 3) {
        currentStep++;
        updateStepsUI();
        checkStepValidity();
      }
    });
  });

  prevBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (currentStep > 1) {
        currentStep--;
        updateStepsUI();
        checkStepValidity();
      }
    });
  });
});
</script>
</body>
</html>
